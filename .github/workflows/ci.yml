name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags: the guard audits every tag
      - name: Release-tag hygiene
        run: scripts/check-release-tags.sh

  go-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Cache vendored C build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: go/internal/libyang/.build
          # Exact-key only: a restored .build must correspond byte-for-byte to
          # the pinned engine inputs (build.sh early-exits on a hit).
          key: cbuild-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('VERSIONS', 'go/internal/libyang/build.sh', 'scripts/build-yanglint-oracle.sh') }}
      - name: Go default pure gate
        env:
          # Randomize test order in CI only; locally -shuffle would bypass the
          # go test result cache on every run.
          GOFLAGS: -shuffle=on
        run: scripts/check-go-default-pure.sh
      - name: Build static engine
        run: bash go/internal/libyang/build.sh
      - name: Go lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: go
      - name: Go vet + test
        run: cd go && CGO_ENABLED=1 go vet ./... && CGO_ENABLED=1 go test -race ./...
      - name: Go conformance runner
        run: cd go && go run ./cmd/cambium all
      - name: Engine config diff
        run: scripts/diff-engine-config.sh

  go-linux-glibc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Cache vendored C build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: go/internal/libyang/.build
          key: cbuild-${{ runner.os }}-${{ runner.arch }}-glibc-${{ hashFiles('VERSIONS', 'go/internal/libyang/build.sh', 'scripts/build-yanglint-oracle.sh') }}
      - name: Go default pure gate
        env:
          # Randomize test order in CI only; locally -shuffle would bypass the
          # go test result cache on every run.
          GOFLAGS: -shuffle=on
        run: scripts/check-go-default-pure.sh
      - name: Build static engine
        run: bash go/internal/libyang/build.sh
      - name: Go lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: go
      - name: Go vet + test
        run: cd go && CGO_ENABLED=1 go vet ./... && CGO_ENABLED=1 go test -race ./...
      - name: fuzz smoke (20s each)
        run: cd go && CGO_ENABLED=0 go test ./internal/yangparse -run '^$' -fuzz '^FuzzParse$' -fuzztime=20s && CGO_ENABLED=0 go test ./datatree -run '^$' -fuzz '^Fuzz' -fuzztime=20s && CGO_ENABLED=0 go test ./internal/xsdregex -run '^$' -fuzz '^Fuzz' -fuzztime=20s
      - name: Go conformance runner
        run: cd go && go run ./cmd/cambium all
      - name: Build yanglint oracle
        run: scripts/build-yanglint-oracle.sh
      - name: Yanglint oracle conformance
        env:
          CAMBIUM_YANGLINT: ${{ github.workspace }}/go/internal/libyang/.build/yanglint-oracle-install/bin/yanglint
        run: cd go && go run ./cmd/cambium all
      - name: Engine config diff
        run: scripts/diff-engine-config.sh

  go-linux-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.13.0
      - name: Cache vendored C build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: go/internal/libyang/.build
          # The musl toolchain (zig target/version) is declared in this file,
          # so hash the workflow itself into the key.
          key: cbuild-${{ runner.os }}-${{ runner.arch }}-musl-${{ hashFiles('VERSIONS', 'go/internal/libyang/build.sh', '.github/workflows/ci.yml') }}
      - name: Build static engine for musl
        env:
          CAMBIUM_CC: zig cc -target x86_64-linux-musl
        run: bash go/internal/libyang/build.sh
      - name: Execute static Go tests under musl (no -race)
        # The glibc lane runs `go test -race ./...`. This lane proves the
        # zig/musl static binaries execute; the script probes -race support but
        # runs without -race to keep the musl signal focused on libc/linkage.
        env:
          CGO_ENABLED: 1
          CC: zig cc -target x86_64-linux-musl
          GOOS: linux
          GOARCH: amd64
        run: scripts/test-go-musl-static.sh
