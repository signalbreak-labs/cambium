name: conformance-artifact

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version label to embed in the artifact
        required: false
        type: string

# Read-only by default; only the attach job below gets a write token, and it
# runs no repository code.
permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check conformance package
        run: scripts/check-conformance-package.sh

      - name: Build conformance package
        shell: bash
        env:
          # Never interpolate workflow inputs into the script body — env
          # indirection keeps a crafted input from becoming shell syntax.
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          version="$VERSION_INPUT"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}"
          fi
          scripts/package-conformance.py --version "$version" --out-dir dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cambium-conformance
          path: |
            dist/cambium-conformance-*.tar.gz
            dist/cambium-conformance-*.tar.gz.sha256

  attach:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cambium-conformance
          path: dist

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/cambium-conformance-* --clobber
