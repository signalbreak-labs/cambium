name: osv-scan

on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - ".gitmodules"
      - "VERSIONS"
      - "go/go.mod"
  workflow_dispatch:

concurrency:
  group: osv-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install OSV scanner
        env:
          OSV_SCANNER_VERSION: 2.3.8
          # From osv-scanner_SHA256SUMS of the pinned release; bump together.
          OSV_SCANNER_SHA256: bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc
        run: |
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" -o osv-scanner
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version
      - name: Build vendored C engine
        run: bash go/internal/libyang/build.sh
      - name: Run OSV scanner
        run: osv-scanner --recursive .
